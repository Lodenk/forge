name: Build and Push Sidecar Image

on:
  push:
    branches:
      - podtracker-sidecar

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push sidecar image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: forge-sidecar/Dockerfile
          push: true
          tags: ghcr.io/lodenk/forge-sidecar:latest
          # Cache Maven deps and Docker layers between runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
